<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>House Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23384a;
    --paper:#ffffff;
    --card:#ffffff;
    --deep:#3697c4;
    --deep-dark:#256f94;
    --brass:#d280be;
    --brass-light:#f9c4d6;
    --line:#bfcfe6;
    --done:#feae95;
    --accent:#d280be;
    --shadow: 0 2px 10px rgba(54,151,196,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:60px;
  }
  header{
    position:relative;
    background:linear-gradient(160deg, var(--deep), var(--deep-dark));
    color:#fff;
    padding:28px 20px 22px;
    border-radius:0 0 22px 22px;
    box-shadow: var(--shadow);
  }
  .weather-widget{
    position:absolute;
    top:16px;
    right:16px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.16);
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  .weather-widget .weather-icon{ font-size:16px; line-height:1; }
  .weather-widget .weather-place{
    font-weight:500;
    opacity:.75;
    font-size:11px;
    margin-left:2px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.75;
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 18px;
    line-height:1.1;
  }
  .toggle-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .toggle{
    flex:1;
    display:flex;
    background:rgba(255,255,255,0.12);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.75);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 6px;
    border-radius:9px;
    cursor:pointer;
  }
  .toggle button.active{
    background:#fff;
    color:var(--deep-dark);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 10px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    color:#5b7286;
    font-size:13px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--brass);
    width:0%;
    transition:width .25s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:opacity .2s ease;
  }
  .card.done{ opacity:0.6; }
  .card-main{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 14px 12px;
    cursor:pointer;
  }
  .checkbox{
    flex:none;
    width:26px;
    height:26px;
    border-radius:8px;
    border:2px solid var(--brass);
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .card.done .checkbox{
    background:var(--done);
    border-color:var(--done);
  }
  .checkbox svg{
    width:15px;
    height:15px;
    opacity:0;
    transition:opacity .15s ease;
  }
  .card.done .checkbox svg{ opacity:1; }
  .card-body{ flex:1; min-width:0; }
  .card-cat{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    color:var(--deep-dark);
    margin:0 0 4px;
  }
  .card.done .card-cat{ text-decoration:line-through; text-decoration-color:var(--done); }
  .card-task{
    font-size:14px;
    line-height:1.5;
    color:#3f4d49;
    white-space:pre-line;
    margin:0;
  }
  .step-list{
    list-style:none;
    margin:8px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .step-item{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-num{
    flex:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:linear-gradient(160deg, var(--deep), var(--deep-dark));
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step-icon{
    flex:none;
    font-size:16px;
  }
  .step-text{
    font-size:14px;
    line-height:1.4;
    color:#3f4d49;
  }
  .step-outro{
    margin-top:10px;
  }
  .video-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--deep);
    background:var(--brass-light);
    padding:6px 10px;
    border-radius:20px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .card-links{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .video-embed{
    padding:0 14px 14px;
  }
  .video-embed iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    display:block;
  }
  .notes{
    background:#eef3fa;
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    color:#4d6072;
    margin-top:6px;
    line-height:1.5;
  }
  .notes strong{ color:var(--deep-dark); }
  .milestone{
    margin:-10px 0 18px;
    font-size:13px;
    font-weight:600;
    color:var(--accent);
    min-height:16px;
  }
  .confetti-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    top:-12px;
    width:8px;
    height:14px;
    opacity:0.9;
    border-radius:2px;
    animation-name:confetti-fall;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    to{ transform:translateY(100vh) rotate(360deg); opacity:0.4; }
  }
  footer{
    text-align:center;
    font-size:12px;
    color:#98a29a;
    padding:20px 16px 0;
  }
</style>
</head>
<body>

<header>
  <div class="weather-widget" id="weatherWidget">
    <span class="weather-icon" id="weatherIcon">🌤️</span>
    <span id="weatherTemp">--°</span>
    <span class="weather-place">South Haven</span>
  </div>
  <p class="eyebrow" id="modeEyebrow">Opening the house</p>
  <h1 id="pageTitle">Opening Checklist</h1>
  <div class="toggle-row">
    <div class="toggle" id="modeToggle">
      <button data-mode="open">Open</button>
      <button data-mode="close">Close</button>
    </div>
    <div class="toggle" id="buildingToggle">
      <button data-building="730">730</button>
      <button data-building="2B">2B</button>
    </div>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <span id="progressLabel">0 / 0 done</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <p class="milestone" id="milestoneLabel"></p>
  <div id="list"></div>
  <div class="notes" id="notesBox"></div>
</main>

<footer>Tap a card to check it off · your progress is saved on this device</footer>

<script>
/* ---------------------------------------------------------------
   VIDEO LINKS
   To attach a how-to video to any item, fill in "video" below with
   a YouTube or Vimeo URL, e.g.
     video: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
   Leave it as "" for items with no video.

   PHOTOS
   To attach a photo, fill in "image" with a path relative to this
   file (e.g. "images/circuit-breakers-730.jpeg") after uploading
   the picture into an "images" folder in the repo.
------------------------------------------------------------------*/
const DATA = {
  open: {
    "730": [
      { cat:"Water Heater", text:"Turn on circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"", image:"images/circuit-breakers-730.jpeg" },
      { cat:"HVAC", text:"Set thermostat to desired mode and temp", video:"" },
      { cat:"Outside Cameras", text:"Text Dad to turn off security cameras", video:"" },
      { cat:"Shed Keys", text:"In 730, open the cabinet that contains the circuit breaker panel.\nAlways return keys immediately after opening. \nWe do not have duplicates", video:"" },
      { cat:"Golf Cart", text:"Charge when done for the day.", steps:[
          { icon:"💺", text:"Lift the front seat to flip on the master switch" },
          { icon:"🔑", text:"Turn the key in the dashboard" },
          { icon:"↔️", text:"Pick Forward / Neutral / Reverse between the driver & passenger legs" },
          { icon:"🅿️", text:"Set the parking brake when you park" },
          { icon:"🚧", text:"Cross main streets only — never drive down them" }
        ], outro:"Have fun! 🏌️", video:"https://youtu.be/ytqk_6CRZRI" },
      { cat:"Shades/Blinds", text:"Open shades/blinds as desired", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Fresh sheets should be on your beds", video:"" }
    ],
    "2B": [
      { cat:"Water Heater", text:"Turn on circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"", image:"images/circuit-breakers-water-heater-2b-on.jpeg"},
      { cat:"HVAC", text:"Set thermostat to desired mode and temp", video:"" },
      { cat:"Outside Cameras", text:"Text Dad to turn off the security cameras", video:"" },
      { cat:"Shades/Blinds", text:"Open shades/blinds as desired", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Fresh sheets should be on your beds", video:"" }
    ]
  },
  close: {
    "730": [
      { cat:"Water Heater", text:"Turn off circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"" },
      { cat:"HVAC", text:"Set thermostat to:\nWinter - Heat 55 degrees\nSummer - Cool 80 degrees\nSpring/Fall - Off", video:"" },
      { cat:"Outside Cameras", text:"Text Dad to turn on security cameras", video:"" },
      { cat:"Shed Keys", text:"Ensure all 3 sheds are locked and the keys are in 730. \nWe do not have duplicates", video:"" },
      { cat:"Golf Cart", text:"When you are leaving: \nUnplug charger from golf cart\nSet parking brake\nShut off key\nShut off master switch", video:"" },
      { cat:"Lights", text:"Shut off lights", video:"" },
      { cat:"Garbage", text:"Empty all garbage cans and take to garbage can by shed", video:"" },
      { cat:"Shades/Blinds", text:"Close all shades/blinds", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Strip beds\nThrow dirty bedding in the washer (if you have time, wash them; otherwise leave in washer)\nPut fresh bedding on the bed", video:"" },
      { cat:"Refrigerators", text:"Remove anything that will spoil", video:"" }
    ],
    "2B": [
      { cat:"Water Heater", text:"Turn off circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"", image:"images/circuit-breakers-water-heater-2b-off.jpg"},
      { cat:"HVAC", text:"Set thermostat to:\nWinter - Heat 55 degrees\nSummer - Cool 80 degrees\nSpring/Fall - Off\nShut garage HVAC off", video:"" },
      { cat:"Outside Cameras", text:"Text Dad to turn on security cameras", video:"" },
      { cat:"Lights", text:"Shut off lights\nLeave motion light on", video:"" },
      { cat:"Garbage", text:"Empty all garbage cans and take to the garbage can by the shed", video:"" },
      { cat:"Shades/Blinds", text:"Close all shades/blinds", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Strip beds\nThrow dirty bedding in the washer (if you have time, wash them; otherwise leave in washer)\nPut fresh bedding on the bed", video:"" },
      { cat:"Refrigerators", text:"Remove anything that will spoil", video:"" }
    ]
  }
};

//const NOTES = "<strong>Note:</strong> Get the circuit breaker (CB) number for the hot water heater at each building.";

const CATEGORY_EMOJI = {
  "Water Heater": "🔥",
  "HVAC": "❄️",
  "Cameras": "📷",
  "Shed Keys": "🔑",
  "Golf Cart": "🚙",
  "Shades/Blinds": "🪟",
  "Beds/Bedding/Towels": "🛏️",
  "Lights": "💡",
  "Garbage": "🗑️",
  "Refrigerators": "🧊"
};

let mode = "open";
let building = "730";

const WEATHER_CODE_ICON = {
  0:"☀️", 1:"🌤️", 2:"⛅", 3:"☁️",
  45:"🌫️", 48:"🌫️",
  51:"🌦️", 53:"🌦️", 55:"🌦️", 56:"🌦️", 57:"🌦️",
  61:"🌧️", 63:"🌧️", 65:"🌧️", 66:"🌧️", 67:"🌧️",
  71:"🌨️", 73:"🌨️", 75:"🌨️", 77:"🌨️",
  80:"🌦️", 81:"🌧️", 82:"⛈️",
  85:"🌨️", 86:"🌨️",
  95:"⛈️", 96:"⛈️", 99:"⛈️"
};

async function loadWeather(){
  try{
    const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=42.4029&longitude=-86.2732&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto");
    if(!res.ok) throw new Error("weather request failed");
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const icon = WEATHER_CODE_ICON[data.current.weather_code] || "🌡️";
    document.getElementById("weatherIcon").textContent = icon;
    document.getElementById("weatherTemp").textContent = `${temp}°`;
  }catch(e){
    document.getElementById("weatherWidget").style.display = "none";
  }
}
loadWeather();

function embedUrl(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu")){
      let id = u.searchParams.get("v");
      if(!id) id = u.pathname.replace("/","");
      return `https://www.youtube.com/embed/${id}`;
    }
    if(u.hostname.includes("vimeo")){
      const id = u.pathname.replace("/","");
      return `https://player.vimeo.com/video/${id}`;
    }
  }catch(e){}
  return null;
}

function storageKey(i){ return `checklist:${mode}:${building}:${i}`; }

function render(){
  document.getElementById("pageTitle").textContent = (mode === "open" ? "Opening" : "Closing") + " Checklist";
  document.getElementById("modeEyebrow").textContent = mode === "open" ? "Opening the house" : "Closing the house";
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.querySelectorAll("#buildingToggle button").forEach(b => b.classList.toggle("active", b.dataset.building === building));

  const items = DATA[mode][building];
  const list = document.getElementById("list");
  list.innerHTML = "";

  items.forEach((item, i) => {
    const key = storageKey(i);
    const isDone = localStorage.getItem(key) === "1";

    const card = document.createElement("div");
    card.className = "card" + (isDone ? " done" : "");

    const vidUrl = item.video ? embedUrl(item.video) : null;

    card.innerHTML = `
      <div class="card-main">
        <div class="checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="card-body">
          <p class="card-cat">${CATEGORY_EMOJI[item.cat] ? CATEGORY_EMOJI[item.cat] + " " : ""}${item.cat}</p>
          ${item.text ? `<p class="card-task">${item.text}</p>` : ""}
          ${item.steps ? `
          <ol class="step-list">
            ${item.steps.map((s, si) => `
            <li class="step-item">
              <span class="step-num">${si + 1}</span>
              <span class="step-icon">${s.icon || ""}</span>
              <span class="step-text">${s.text}</span>
            </li>`).join("")}
          </ol>` : ""}
          ${item.outro ? `<p class="card-task step-outro">${item.outro}</p>` : ""}
        </div>
        ${(vidUrl || item.image) ? `
        <div class="card-links">
          ${vidUrl ? `<button class="video-link" data-i="${i}">▶ Video</button>` : ""}
          ${item.image ? `<a class="video-link" href="${item.image}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🖼 Photo</a>` : ""}
        </div>` : ""}
      </div>
      <div class="video-embed" id="video-${i}" style="display:none;"></div>
    `;

    card.querySelector(".card-main").addEventListener("click", () => {
      const nowDone = !card.classList.contains("done");
      card.classList.toggle("done", nowDone);
      localStorage.setItem(key, nowDone ? "1" : "0");
      const justCompleted = updateProgress();
      if(nowDone && justCompleted) triggerConfetti();
    });

    if(vidUrl){
      const btn = card.querySelector("button.video-link");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const box = card.querySelector(`#video-${i}`);
        if(box.style.display === "none"){
          box.style.display = "block";
          box.innerHTML = `<iframe src="${vidUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          btn.textContent = "▲ Hide video";
        } else {
          box.style.display = "none";
          box.innerHTML = "";
          btn.textContent = "▶ Video";
        }
      });
    }

    list.appendChild(card);
  });

  document.getElementById("notesBox").innerHTML = NOTES;
  updateProgress();
}

function milestoneText(done, total){
  if(total === 0) return "";
  const pct = done / total;
  if(pct === 1) return mode === "open" ? "🎉 House is open — vacation mode: ON" : "🔒 Locked up tight — see you next time!";
  if(pct === 0) return mode === "open" ? "Let's get this vacation started" : "Time to button things up";
  if(pct >= 0.5) return "Halfway to the beach";
  return "Making progress";
}

function updateProgress(){
  const items = DATA[mode][building];
  let done = 0;
  items.forEach((_, i) => { if(localStorage.getItem(storageKey(i)) === "1") done++; });
  document.getElementById("progressLabel").textContent = `${done} / ${items.length} done`;
  document.getElementById("progressFill").style.width = items.length ? `${(done/items.length)*100}%` : "0%";
  document.getElementById("milestoneLabel").textContent = milestoneText(done, items.length);
  return items.length > 0 && done === items.length;
}

function triggerConfetti(){
  const colors = ["#3697c4", "#82b2d6", "#d280be", "#feae95", "#f9c4d6", "#deb7e4", "#bfcfe6"];
  const container = document.createElement("div");
  container.className = "confetti-container";
  document.body.appendChild(container);
  for(let i = 0; i < 60; i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.4) + "s";
    piece.style.animationDuration = (2.2 + Math.random() * 1.2) + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 3600);
}

document.getElementById("modeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  mode = btn.dataset.mode;
  render();
});
document.getElementById("buildingToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  building = btn.dataset.building;
  render();
});

render();
</script>
</body>
</html>
