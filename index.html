<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>House Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b2a;
    --paper:#faf6ee;
    --card:#ffffff;
    --deep:#1f4e5f;
    --deep-dark:#173c49;
    --brass:#b8863f;
    --brass-light:#e8c98a;
    --line:#e4ddcc;
    --done:#5c8a6b;
    --shadow: 0 2px 10px rgba(23,60,73,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(160deg, var(--deep), var(--deep-dark));
    color:#fff;
    padding:28px 20px 22px;
    border-radius:0 0 22px 22px;
    box-shadow: var(--shadow);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.75;
    margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 18px;
    line-height:1.1;
  }
  .toggle-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .toggle{
    flex:1;
    display:flex;
    background:rgba(255,255,255,0.12);
    border-radius:12px;
    padding:4px;
    gap:4px;
  }
  .toggle button{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.75);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 6px;
    border-radius:9px;
    cursor:pointer;
  }
  .toggle button.active{
    background:#fff;
    color:var(--deep-dark);
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 10px;
  }
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    color:#5a6a63;
    font-size:13px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--brass);
    width:0%;
    transition:width .25s ease;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:opacity .2s ease;
  }
  .card.done{ opacity:0.6; }
  .card-main{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 14px 12px;
    cursor:pointer;
  }
  .checkbox{
    flex:none;
    width:26px;
    height:26px;
    border-radius:8px;
    border:2px solid var(--brass);
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .card.done .checkbox{
    background:var(--done);
    border-color:var(--done);
  }
  .checkbox svg{
    width:15px;
    height:15px;
    opacity:0;
    transition:opacity .15s ease;
  }
  .card.done .checkbox svg{ opacity:1; }
  .card-body{ flex:1; min-width:0; }
  .card-cat{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    color:var(--deep-dark);
    margin:0 0 4px;
  }
  .card.done .card-cat{ text-decoration:line-through; text-decoration-color:var(--done); }
  .card-task{
    font-size:14px;
    line-height:1.5;
    color:#3f4d49;
    white-space:pre-line;
    margin:0;
  }
  .video-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--deep);
    background:var(--brass-light);
    padding:6px 10px;
    border-radius:20px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .card-links{
    flex:none;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .video-embed{
    padding:0 14px 14px;
  }
  .video-embed iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    display:block;
  }
  .notes{
    background:#f1ede1;
    border-radius:14px;
    padding:14px 16px;
    font-size:13px;
    color:#5a6a5a;
    margin-top:6px;
    line-height:1.5;
  }
  .notes strong{ color:var(--deep-dark); }
  footer{
    text-align:center;
    font-size:12px;
    color:#98a29a;
    padding:20px 16px 0;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="modeEyebrow">Opening the house</p>
  <h1 id="pageTitle">Opening Checklist</h1>
  <div class="toggle-row">
    <div class="toggle" id="modeToggle">
      <button data-mode="open">Open</button>
      <button data-mode="close">Close</button>
    </div>
    <div class="toggle" id="buildingToggle">
      <button data-building="730">730</button>
      <button data-building="2B">2B</button>
    </div>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <span id="progressLabel">0 / 0 done</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div id="list"></div>
  <div class="notes" id="notesBox"></div>
</main>

<footer>Tap a card to check it off · your progress is saved on this device</footer>

<script>
/* ---------------------------------------------------------------
   VIDEO LINKS
   To attach a how-to video to any item, fill in "video" below with
   a YouTube or Vimeo URL, e.g.
     video: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
   Leave it as "" for items with no video.

   PHOTOS
   To attach a photo, fill in "image" with a path relative to this
   file (e.g. "images/circuit-breakers-730.jpeg") after uploading
   the picture into an "images" folder in the repo.
------------------------------------------------------------------*/
const DATA = {
  open: {
    "730": [
      { cat:"Water Heater", text:"Turn on circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"", image:"images/circuit-breakers-730.jpeg" },
      { cat:"HVAC", text:"Set thermostat to desired mode and temp", video:"" },
      { cat:"Cameras", text:"Text Dad to turn off cameras", video:"" },
      { cat:"Shed Keys", text:"Open cabinet that contains circuit breakers.\nAlways return keys immediately after opening", video:"" },
      { cat:"Golf Cart", text:"Check / fill water in batteries; charge as needed\n\nTo use:\nLift front seat to turn on master switch\nTurn on key in dashboard\nSelect Forward/Neutral/Reverse between driver and passenger legs\nSet parking brake when parking\nYou can cross main streets but cannot drive down them - cross only\n\nHave fun!", video:"" },
      { cat:"Shades/Blinds", text:"Open shades/blinds as desired", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Fresh sheets should be on your beds", video:"" }
    ],
    "2B": [
      { cat:"Water Heater", text:"Turn on circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"", image:"images/circuit-breakers-2B.jpeg" },
      { cat:"HVAC", text:"Set thermostat to desired mode and temp", video:"" },
      { cat:"Cameras", text:"Text Dad to turn off cameras", video:"" },
      { cat:"Shades/Blinds", text:"Open shades/blinds as desired", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Fresh sheets should be on your beds", video:"" }
    ]
  },
  close: {
    "730": [
      { cat:"Water Heater", text:"Turn off circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"" },
      { cat:"HVAC", text:"Set thermostat to:\nWinter - Heat 55 degrees\nSummer - Cool 80 degrees\nSpring/Fall - Off", video:"" },
      { cat:"Cameras", text:"Text Dad to turn on cameras", video:"" },
      { cat:"Shed Keys", text:"Ensure all 3 sheds are locked", video:"" },
      { cat:"Golf Cart", text:"Disconnect and unplug charger from wall outlet\n\nWhen done using:\nSet parking brake\nShut off key\nShut off master switch", video:"" },
      { cat:"Lights", text:"Shut off lights", video:"" },
      { cat:"Garbage", text:"Empty all garbage cans", video:"" },
      { cat:"Shades/Blinds", text:"Close all shades/blinds", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Strip beds\nThrow dirty bedding in the washer (if you have time, wash them; otherwise leave in washer)\nPut fresh bedding on the bed", video:"" },
      { cat:"Refrigerators", text:"Remove anything that will spoil", video:"" }
    ],
    "2B": [
      { cat:"Water Heater", text:"Turn off circuit breaker for hot water heater.\n*Leave all other breakers as found", video:"" },
      { cat:"HVAC", text:"Set thermostat to:\nWinter - Heat 55 degrees\nSummer - Cool 80 degrees\nSpring/Fall - Off\nShut garage HVAC off", video:"" },
      { cat:"Cameras", text:"Text Dad to turn on cameras", video:"" },
      { cat:"Lights", text:"Shut off lights\nLeave motion light on", video:"" },
      { cat:"Garbage", text:"Empty all garbage cans", video:"" },
      { cat:"Shades/Blinds", text:"Close all shades/blinds", video:"" },
      { cat:"Beds/Bedding/Towels", text:"Strip beds\nThrow dirty bedding in the washer (if you have time, wash them; otherwise leave in washer)\nPut fresh bedding on the bed", video:"" },
      { cat:"Refrigerators", text:"Remove anything that will spoil\nIf empty, set temp warmer", video:"" }
    ]
  }
};

const NOTES = "<strong>Note:</strong> Get the circuit breaker (CB) number for the hot water heater at each building.";

let mode = "open";
let building = "730";

function embedUrl(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu")){
      let id = u.searchParams.get("v");
      if(!id) id = u.pathname.replace("/","");
      return `https://www.youtube.com/embed/${id}`;
    }
    if(u.hostname.includes("vimeo")){
      const id = u.pathname.replace("/","");
      return `https://player.vimeo.com/video/${id}`;
    }
  }catch(e){}
  return null;
}

function storageKey(i){ return `checklist:${mode}:${building}:${i}`; }

function render(){
  document.getElementById("pageTitle").textContent = (mode === "open" ? "Opening" : "Closing") + " Checklist";
  document.getElementById("modeEyebrow").textContent = mode === "open" ? "Opening the house" : "Closing the house";
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  document.querySelectorAll("#buildingToggle button").forEach(b => b.classList.toggle("active", b.dataset.building === building));

  const items = DATA[mode][building];
  const list = document.getElementById("list");
  list.innerHTML = "";

  items.forEach((item, i) => {
    const key = storageKey(i);
    const isDone = localStorage.getItem(key) === "1";

    const card = document.createElement("div");
    card.className = "card" + (isDone ? " done" : "");

    const vidUrl = item.video ? embedUrl(item.video) : null;

    card.innerHTML = `
      <div class="card-main">
        <div class="checkbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="card-body">
          <p class="card-cat">${item.cat}</p>
          <p class="card-task">${item.text}</p>
        </div>
        ${(vidUrl || item.image) ? `
        <div class="card-links">
          ${vidUrl ? `<button class="video-link" data-i="${i}">▶ Video</button>` : ""}
          ${item.image ? `<a class="video-link" href="${item.image}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🖼 Photo</a>` : ""}
        </div>` : ""}
      </div>
      <div class="video-embed" id="video-${i}" style="display:none;"></div>
    `;

    card.querySelector(".card-main").addEventListener("click", () => {
      const nowDone = !card.classList.contains("done");
      card.classList.toggle("done", nowDone);
      localStorage.setItem(key, nowDone ? "1" : "0");
      updateProgress();
    });

    if(vidUrl){
      const btn = card.querySelector("button.video-link");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const box = card.querySelector(`#video-${i}`);
        if(box.style.display === "none"){
          box.style.display = "block";
          box.innerHTML = `<iframe src="${vidUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
          btn.textContent = "▲ Hide video";
        } else {
          box.style.display = "none";
          box.innerHTML = "";
          btn.textContent = "▶ Video";
        }
      });
    }

    list.appendChild(card);
  });

  document.getElementById("notesBox").innerHTML = NOTES;
  updateProgress();
}

function updateProgress(){
  const items = DATA[mode][building];
  let done = 0;
  items.forEach((_, i) => { if(localStorage.getItem(storageKey(i)) === "1") done++; });
  document.getElementById("progressLabel").textContent = `${done} / ${items.length} done`;
  document.getElementById("progressFill").style.width = items.length ? `${(done/items.length)*100}%` : "0%";
}

document.getElementById("modeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  mode = btn.dataset.mode;
  render();
});
document.getElementById("buildingToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  building = btn.dataset.building;
  render();
});

render();
</script>
</body>
</html>
