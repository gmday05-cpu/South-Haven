name: Update water temp

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch South Haven buoy reading and write water-temp.json
        run: |
          set -e
          DATA=$(curl -sf "https://www.ndbc.noaa.gov/data/realtime2/45168.txt") || { echo "Fetch failed, leaving water-temp.json unchanged"; exit 0; }
          LATEST=$(echo "$DATA" | sed -n '3p')
          WTMP_C=$(echo "$LATEST" | awk '{print $15}')
          if [ -z "$WTMP_C" ] || [ "$WTMP_C" = "MM" ]; then
            echo "No valid water temp in latest reading, leaving water-temp.json unchanged"
            exit 0
          fi
          WTMP_F=$(awk -v c="$WTMP_C" 'BEGIN { printf "%.0f", (c * 9 / 5) + 32 }')
          OBSERVED_AT=$(echo "$LATEST" | awk '{printf "%s-%s-%sT%s:%s:00Z", $1, $2, $3, $4, $5}')
          cat > water-temp.json << EOF
          {
            "station": "45168",
            "stationName": "South Haven Buoy, MI",
            "tempF": $WTMP_F,
            "observedAt": "$OBSERVED_AT",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add water-temp.json
          if ! git diff --staged --quiet; then
            git commit -m "Update South Haven water temp"
            git push
          fi
